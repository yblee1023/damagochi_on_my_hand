<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocket Creature</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --page: #0e0e10;
  --shell-hi: #4a4a50;
  --shell: #34343a;
  --shell-lo: #1d1d21;
  --seam: #0a0a0c;
  --bezel: #131316;
  --lcd: #d7d8cf;
  --lcd-dim: #b4b5ac;
  --ink: #16161a;
  --key: #c9c9c3;
  --key-lo: #8d8d88;
  --label: #8e8e96;
  --label-hi: #e6e6ea;
}
:root[data-theme="light"] { --page: #0e0e10; }

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--page);
  color: var(--label-hi);
  font-family: "Silkscreen", ui-monospace, "Courier New", monospace;
  font-size: 12px;
  line-height: 1.6;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 26px 14px 46px;
  gap: 16px;
  -webkit-font-smoothing: none;
}

/* ---------------- shell ---------------- */
.device {
  width: min(330px, 100%);
  padding: 20px 20px 18px;
  border-radius: 50% 50% 44% 44% / 32% 32% 40% 40%;
  background:
    linear-gradient(168deg, var(--shell-hi) 0%, var(--shell) 34%, var(--shell-lo) 100%);
  border: 2px solid #55555c;
  box-shadow:
    inset 0 2px 0 rgba(255,255,255,.22),
    inset 0 -18px 30px rgba(0,0,0,.55),
    0 20px 34px rgba(0,0,0,.6);
  position: relative;
}
/* 가장자리 접합선 — 실물 완구의 상하 케이스 분리선 */
.device::after {
  content: "";
  position: absolute;
  left: 6px; right: 6px; top: 50%;
  height: 1px;
  background: var(--seam);
  opacity: .35;
  pointer-events: none;
}
.brand {
  text-align: center;
  font-size: 9px;
  letter-spacing: .18em;
  color: rgba(255,255,255,.3);
  margin-bottom: 10px;
}

/* ---------------- icon strips ---------------- */
.strip {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 2px;
  padding: 0 2px;
}
.ic {
  appearance: none;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 2px;
  padding: 3px 0 2px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
  font: inherit;
  font-size: 8px;
  letter-spacing: .06em;
  color: var(--label);
}
.ic canvas { display: block; image-rendering: pixelated; opacity: .62; }
.ic[data-sel="1"] { border-color: var(--key); color: var(--label-hi); }
.ic[data-sel="1"] canvas { opacity: 1; }
.ic[data-alert="1"] canvas { animation: pulse 1s steps(2, end) infinite; opacity: 1; }
.ic[data-alert="1"] { color: var(--label-hi); }
@keyframes pulse { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: .2; } }

/* ---------------- screen ---------------- */
.bezel {
  margin: 8px 0;
  padding: 9px;
  border-radius: 4px;
  background: var(--bezel);
  box-shadow: inset 0 2px 8px rgba(0,0,0,.75), 0 1px 0 rgba(255,255,255,.1);
}
.screen { position: relative; background: var(--lcd); overflow: hidden; }
#lcd.blink { filter: invert(1); }
#lcd { display: block; width: 100%; height: auto; image-rendering: pixelated; }
.grid {
  position: absolute; inset: 0; pointer-events: none;
  background:
    repeating-linear-gradient(to bottom, rgba(22,22,26,.07) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(to right, rgba(22,22,26,.05) 0 1px, transparent 1px 3px);
}

/* ---------------- keys ---------------- */
.keys { display: flex; justify-content: center; gap: 20px; margin-top: 12px; }
.key {
  width: 38px; height: 38px; border-radius: 50%;
  border: 0; cursor: pointer;
  background: radial-gradient(circle at 34% 28%, #eaeae6, var(--key) 52%, var(--key-lo));
  color: #25252a;
  font: inherit; font-size: 10px;
  box-shadow: 0 4px 0 #101013, inset 0 -3px 4px rgba(0,0,0,.25);
}
.key:active { transform: translateY(3px); box-shadow: 0 1px 0 #101013, inset 0 -2px 4px rgba(0,0,0,.25); }
.key:focus-visible { outline: 1px solid var(--key); outline-offset: 3px; }

.foot { font-size: 8px; color: #55555c; text-align: center; letter-spacing: .1em; }

/* ---------------- modal ---------------- */
.modal {
  position: fixed; inset: 0; z-index: 20;
  background: rgba(8,8,10,.86);
  display: none; align-items: center; justify-content: center; padding: 18px;
}
.modal[data-open="1"] { display: flex; }
.box {
  width: min(300px, 100%);
  background: var(--lcd); color: var(--ink);
  padding: 16px; border: 2px solid var(--ink);
}
.box h2 { margin: 0 0 6px; font-size: 12px; letter-spacing: .06em; }
.clock {
  font-size: 34px; line-height: 1; letter-spacing: .04em; text-align: center;
  margin: 10px 0 4px; font-variant-numeric: tabular-nums;
}
.clock .colon { display: inline-block; width: .5em; }
.clock .colon[data-off="1"] { visibility: hidden; }
.date { font-size: 9px; letter-spacing: .14em; text-align: center; margin-bottom: 12px; }
.box p { margin: 0 0 12px; font-size: 9px; line-height: 1.8; }
.box input {
  width: 100%; background: transparent; border: 1px solid var(--ink);
  color: var(--ink); padding: 7px 8px; font: inherit; font-size: 11px;
  letter-spacing: .1em; margin-bottom: 10px; text-transform: uppercase;
}
.box input:focus-visible { outline: 1px solid var(--ink); outline-offset: 1px; }
.go {
  width: 100%; border: 0; background: var(--ink); color: var(--lcd);
  padding: 9px; font: inherit; font-size: 11px; letter-spacing: .08em; cursor: pointer;
}
.go:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

/* 뒷면 리셋 구멍 — 실수로 누르지 않도록 작고 어둡게 */
.pin {
  display: block; margin: 12px auto 0; padding: 4px 6px;
  background: transparent; border: 0; cursor: pointer;
  color: #55555c; font: inherit; font-size: 7px; letter-spacing: .2em;
}
.pin::before {
  content: ""; display: block; width: 7px; height: 7px; border-radius: 50%;
  margin: 0 auto 3px; background: #0a0a0c;
  box-shadow: inset 0 1px 2px rgba(0,0,0,.9), 0 1px 0 rgba(255,255,255,.08);
}
.pin:hover { color: var(--label); }
.pin:focus-visible { outline: 1px solid var(--key); outline-offset: 2px; }
.go.ghost { background: transparent; color: var(--ink); border: 1px solid var(--ink); margin-top: 8px; }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>

<div class="device">
  <div class="brand">POCKET CREATURE</div>
  <div class="strip" id="stripTop"></div>

  <div class="bezel">
    <div class="screen">
      <canvas id="lcd" width="96" height="72" aria-label="creature screen"></canvas>
      <div class="grid"></div>
    </div>
  </div>

  <div class="strip" id="stripBottom"></div>

  <div class="keys">
    <button class="key" id="keyA" title="prev / left">A</button>
    <button class="key" id="keyB" title="select / close">B</button>
    <button class="key" id="keyC" title="next / right">C</button>
  </div>
  <button class="pin" id="resetPin" aria-label="reset">RESET</button>
</div>

<p class="foot">A / C &nbsp;MOVE &nbsp;&middot;&nbsp; B &nbsp;SELECT</p>

<div class="modal" id="modal">
  <div class="box">
    <h2 id="modalTitle">AN EGG ARRIVED</h2>
    <div id="setupClockWrap">
      <div class="clock" id="setupClock">--<span class="colon">:</span>--</div>
      <div class="date" id="setupDate">----.--.-- ---</div>
    </div>
    <p id="modalText">THIS CLOCK DECIDES DAY AND NIGHT. IF IT IS RIGHT, START. TIME KEEPS RUNNING EVEN WHILE THIS TAB IS CLOSED.</p>
    <input id="nameInput" maxlength="6" placeholder="NAME (6)" aria-label="creature name">
    <button class="go" id="goBtn">START</button>
  </div>
</div>

<div class="modal" id="resetModal">
  <div class="box">
    <h2>RESET?</h2>
    <p>THE CREATURE YOU ARE RAISING NOW WILL BE GONE FOR GOOD.</p>
    <button class="go" id="resetPet">NEW EGG</button>
    <button class="go ghost" id="resetAll">NEW EGG + CLEAR DEX</button>
    <button class="go ghost" id="resetCancel">CANCEL</button>
  </div>
</div>

/* =========================================================

   ========================================================= */

  // dev 모드에서는 1분이 20ms — 6일 전체가 3분이면 끝난다
  msPerMin: DEV ? 20 : 60000,
  offlineCapMin: 60 * 24 * 3,

  // 오리지널 P1/P2 내부 수치 (단계 체류 시간): 아기 65분, 어린이 1380분, 청소년 2220분.
  // 아래 값은 누적 나이 기준이다. 성체까지 약 2.5일.
  stages: { hatch: 5, child: 65, teen: 65 + 1380, adult: 65 + 1380 + 2220 },

  // 단계별 고정 취침 시각 [잠드는 시, 깨는 시]
  // 오리지널 P1/P2 그대로. 아기는 밤 스케줄이 아니라 부화 30분 뒤 5분 낮잠이다.
  sleepWindow: {
    EGG: [20, 9], BABY: [20, 9], CHILD: [20, 9], TEEN: [21, 9], ADULT: [22, 9]
  },
  sleepByForm: { starborn: [22, 10] },   // 숨은 형태는 한 시간 늦게 깬다
  babyNap: { after: 30, length: 5 },

  // 단계별 분당 감소량 — 오리지널 P1/P2의 하트 손실 주기를 100점 척도로 환산했다.
  // 하트 1칸 = 25점. 어린이 배고픔 50분/칸 = 200분에 바닥 = 분당 0.5.
  rates: {
    EGG:   { hunger: 0,    affection: 0    },
    BABY:  { hunger: 8.3,  affection: 6.25 },  // 3분/칸, 4분/칸 — 한 시간 내내 손이 간다
    CHILD: { hunger: 0.50, affection: 0.42 },  // 50분/칸, 60분/칸
    TEEN:  { hunger: 0.33, affection: 0.29 },  // 75분/칸, 85분/칸
    ADULT: { hunger: 0.29, affection: 0.26 }   // 86분/칸
  },
  decay: {
    hygiene: 0.05,
    hygienePerPoop: 0.15,
    energyAwake: 0.10,
    energySleep: -0.30   // 음수 = 수면 중 회복
  },

  // 호출: 돌봄이 필요해지면 화면이 깜빡인다
  // 케어 실수 타이머는 하트 감소 주기에 묶인다 (오리지널 규칙).
  // 하트 한 칸이 빠지는 시간만큼 호출을 무시하면 실수 하나.
  call: { minInterval: 15, lightGrace: 15 },   // 잠든 뒤 15분 안에 불을 꺼야 한다

  health: {
    regen: 0.15,
    sick: 0.12,          // 병을 방치하는 동안 — 실제 사망 경로다
    sickThreshold: 50,
    sickChance: 0.004,
    sickFromNeglect: 0.0015   // 호출을 계속 무시하면 병이 난다
  },

  // 응답 없는 호출이 분당 깎는 체력 — 굶기는 것이 가장 위험하다
  callDrain: { HUNGRY: 0.10, LONELY: 0.03, MESS: 0.03, SLEEP: 0.04, SICK: 0 },

  poop: { afterMeal: 30, delayVar: 20, randomChance: 0.002, max: 4 },

  // 체중 — 간식을 막는 것은 제한이 아니라 무게다 (오리지널 규칙)
  // 밥 +1, 간식 +2, 미니게임 -1. 기본 체중 아래로는 내려가지 않는다.
  weight: {
    base: { EGG: 5, BABY: 5, CHILD: 10, TEEN: 20, ADULT: 30 },
    max: 99, meal: 1, snack: 2, play: -1,
    sickPerUnit: 0.00018,  // 기본 체중 초과분 1당 분당 발병 확률
    heavyAt: 40,           // 기본 체중보다 이만큼 넘으면 몸 자체가 상한다
    heavyDrain: 0.002      // 초과분 1당 분당 체력 감소

  evo: {
    // 오리지널 구조: 청소년은 어린이 단계의 돌봄 품질로, 성체는 청소년 단계의
    // 돌봄 품질로 갈린다. 각 단계 0~2회면 양호, 3회 이상이면 불량.
    goodMistakes: 2,
    secretMistakes: 0, secretPlays: 40,

    cure:  { health: 25 },

    playLose: { affection: 8 }
  }
};

function loadJSON(k) {
  try { var r = localStorage.getItem(k); return r ? JSON.parse(r) : null; }
  catch (e) { return null; }
}
function saveJSON(k, v) {
  try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {}

var S = null;
function newPet(name) {
  return {
    v: 3, name: name || "PIP", born: Date.now(), lastSeen: Date.now(),
    ageMin: 0, form: "egg",
    stats: { hunger: 80, hygiene: 100, energy: 90, affection: 60, health: 100 },
    clock: Date.now(),          // 가상 시계 — 낮밤 판정에 쓴다
    lightOn: true, sleeping: false, sick: false,
    call: null,                 // { type, since, counted }
    poops: [], nextPoop: null,
    weight: 5,
    mistakes: 0, stageMistakes: 0, playCount: 0,
    sum: { affection: 0, health: 0, hygiene: 0, n: 0 },
    dead: false, deathAge: 0, deathCause: ""
  };
}
/* 예전 버전 세이브에 없는 필드를 채운다 — 비어 있으면 계산이 NaN으로 번진다 */
function migrate(saved) {
  var base = newPet(saved.name || "PIP"), k;
  for (k in base) {
    if (Object.prototype.hasOwnProperty.call(base, k) && !(k in saved)) { saved[k] = base[k]; }
  }
  saved.stats = saved.stats || {};
  for (k in base.stats) {
    if (typeof saved.stats[k] !== "number" || isNaN(saved.stats[k])) { saved.stats[k] = base.stats[k]; }
  }
  if (!saved.sum) { saved.sum = base.sum; }
  return saved;
}

function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function avg(k) { return S.sum.n ? S.sum[k] / S.sum.n : 0; }

/* =========================================================
   SIMULATION
   ========================================================= */
var pendingEvents = [];

function stageKey() {
  var f = FORMS[S.form];
  return f ? f.stage : "CHILD";
}
function sleepWindowNow() {
  return CFG.sleepByForm[S.form] || CFG.sleepWindow[stageKey()] || CFG.sleepWindow.CHILD;
}
function inSleepWindow() {
  if (stageKey() === "BABY") {   // 아기는 딱 한 번, 5분만 잔다
    var t0 = CFG.stages.hatch + CFG.babyNap.after;
    return S.ageMin >= t0 && S.ageMin < t0 + CFG.babyNap.length;
  }
  var w = sleepWindowNow();
  var h = new Date(S.clock).getHours();
  return w[0] > w[1] ? (h >= w[0] || h < w[1]) : (h >= w[0] && h < w[1]);
}

/* 지금 돌봄을 요구하는 항목 — 없으면 null. 우선순위 순서다 */
/* 현재 단계에서 하트 한 칸이 빠지는 데 걸리는 시간(분) — 케어 실수 타이머의 단위 */
function callInterval() {
  var r = CFG.rates[stageKey()] || CFG.rates.CHILD;
  return r.hunger > 0 ? Math.max(CFG.call.minInterval, Math.round(25 / r.hunger)) : 60;
}

function baseWeight() { return CFG.weight.base[stageKey()] || 10; }
function addWeight(n) {
  if (stageKey() === "BABY") { return; }   // 아기는 살이 찌지 않는다
  S.weight = clamp(S.weight + n, baseWeight(), CFG.weight.max);
}

function currentCall() {
  if (S.dead || S.form === "egg") { return null; }
  if (stageKey() !== "BABY" && inSleepWindow() && S.lightOn) { return "SLEEP"; }
  if (S.sleeping) { return null; }
  if (S.sick) { return "SICK"; }
  if (S.stats.hunger <= 0) { return "HUNGRY"; }
  if (S.stats.affection <= 0) { return "LONELY"; }
  if (S.poops.length >= 2 || S.stats.hygiene <= 0) { return "MESS"; }
  return null;
}

function stepMinute() {
  if (S.dead) { return; }
  S.ageMin += 1;
  S.clock += 60000;
  var st = S.stats;

  if (S.form === "egg") {
    if (S.ageMin >= CFG.stages.hatch) {
      S.form = "baby"; dexSee("baby"); pendingEvents.push({ t: "hatch" });
    }
    return;
  }

  // 아침이 되면 불은 저절로 켜진다
  var night = inSleepWindow();
  if (!night && !S.lightOn) {
    S.lightOn = true;
    pendingEvents.push({ t: "wake" });
  }
  S.sleeping = (stageKey() === "BABY") ? night : (night && !S.lightOn);

  if (S.sleeping) {
    // 자는 동안에는 배고파지지도, 심심해지지도 않는다
    st.energy = clamp(st.energy - CFG.decay.energySleep, 0, 100);
  } else {
    var rate = CFG.rates[stageKey()] || CFG.rates.CHILD;
    st.hunger = clamp(st.hunger - rate.hunger, 0, 100);
    st.affection = clamp(st.affection - rate.affection, 0, 100);
    st.energy = clamp(st.energy - CFG.decay.energyAwake, 0, 100);
    st.hygiene = clamp(st.hygiene - (CFG.decay.hygiene + S.poops.length * CFG.decay.hygienePerPoop), 0, 100);

    if (S.nextPoop !== null && S.ageMin >= S.nextPoop && S.poops.length < CFG.poop.max) {
      S.poops.push({ x: 4 + Math.floor(Math.random() * 74) });
      S.nextPoop = null;
    }
    if (S.nextPoop === null && Math.random() < CFG.poop.randomChance && S.poops.length < CFG.poop.max) {
      S.poops.push({ x: 4 + Math.floor(Math.random() * 74) });
    }
  }

  // 호출 처리 — 한 건의 호출이 실수 하나다. 방치가 길어지면 다시 부른다
  var ct = currentCall();
  var ignored = false;
  if (ct) {
    if (!S.call || S.call.type !== ct) {
      S.call = { type: ct, since: S.ageMin, counted: 0 };
      pendingEvents.push({ t: "call", type: ct });
    }
    var iv = (S.call.type === "SLEEP") ? CFG.call.lightGrace : callInterval();
    var waited = S.ageMin - S.call.since;
    if (waited >= iv) {
      ignored = true;
      var due = Math.floor(waited / iv);
      if (due > S.call.counted) {
        var add = due - S.call.counted;
        S.mistakes += add;        // 평생 누적 — 상태창 표시용
        S.stageMistakes += add;   // 현재 단계분 — 진화 판정에 쓴다
        S.call.counted = due;
      }
    }
  } else {
    S.call = null;
  }

  var drain = 0;
  if (S.sick) { drain += CFG.health.sick; }
  if (ignored) { drain += CFG.callDrain[S.call.type] || 0; }
  var exhausted = st.energy <= 0;   // 밤에 재우지 않으면 여기까지 온다
  var over = S.weight - baseWeight() - CFG.weight.heavyAt;
  if (over > 0) { drain += over * CFG.weight.heavyDrain; }
  if (drain > 0) {
    st.health = clamp(st.health - drain, 0, 100);
  } else if (!exhausted) {
    st.health = clamp(st.health + CFG.health.regen, 0, 100);
  }

  if (!S.sick && !S.sleeping) {
    var risk = 0;
    if (st.health < CFG.health.sickThreshold) { risk += CFG.health.sickChance; }
    if (ignored) { risk += CFG.health.sickFromNeglect; }
    if (exhausted) { risk += CFG.health.sickFromNeglect; }
    risk += Math.max(0, S.weight - baseWeight()) * CFG.weight.sickPerUnit;
    if (risk > 0 && Math.random() < risk) {
      S.sick = true;
      pendingEvents.push({ t: "sick" });
    }
  }

  if (st.health <= 0) {
    S.dead = true; S.deathAge = S.ageMin;
    S.deathCause = S.sick ? "ILLNESS TOOK OVER" : "CARE NEVER CAME";
    dex.records.unshift({ name: S.name, form: S.form, ageMin: S.ageMin, at: Date.now() });
    dex.records = dex.records.slice(0, 12);
    saveJSON(KEY_DEX, dex);
    pendingEvents.push({ t: "death" });
    return;
  }

  if (!S.sleeping) {
    S.sum.affection += st.affection;
    S.sum.health += st.health;
    S.sum.hygiene += st.hygiene;
    S.sum.n += 1;
  }

  checkEvolve();
}

function checkEvolve() {
  var f = S.form, e = CFG.evo;
  if (f === "baby" && S.ageMin >= CFG.stages.child) {
    evolveTo("child");
  } else if (f === "child" && S.ageMin >= CFG.stages.teen) {
    evolveTo(S.stageMistakes <= e.goodMistakes ? "teenFire" : "teenAqua");
  } else if ((f === "teenFire" || f === "teenAqua") && S.ageMin >= CFG.stages.adult) {
    var perfect = S.stageMistakes <= e.secretMistakes && S.playCount >= e.secretPlays &&
      avg("affection") >= e.secretAffection && avg("health") >= e.secretHealth &&
      avg("hygiene") >= e.secretHygiene;
    if (perfect) { evolveTo("starborn"); }
    else if (f === "teenFire") { evolveTo(S.stageMistakes <= e.goodMistakes ? "dragon" : "ashling"); }
    else { evolveTo(S.stageMistakes <= e.goodMistakes ? "guardian" : "murkling"); }
  }
}
function evolveTo(form) { S.form = form; S.stageMistakes = 0;
  if (S.weight < baseWeight()) { S.weight = baseWeight(); }
  dexSee(form); pendingEvents.push({ t: "evolve", form: form }); }

function catchUp() {
  var mins = Math.floor((Date.now() - S.lastSeen) / CFG.msPerMin);
  if (mins < 1) { return 0; }
  var capped = Math.min(mins, CFG.offlineCapMin);
  for (var i = 0; i < capped && !S.dead; i++) { stepMinute(); }
  S.lastSeen += mins * CFG.msPerMin;
  return capped;
}

var ACTIONS = {

    apply(CFG.act.meal);

    startEat("meal");

  },
  snack: function () {

    startEat("snack");
    say("SNACK! WEIGHT +2");
  },
  sweep: function () {
    if (S.dead) { return; }
    if (!S.poops.length) { say("NOTHING TO CLEAN"); return; }
    var n = S.poops.length;
    S.poops = [];
    S.stats.hygiene = clamp(S.stats.hygiene + 25, 0, 100);
    say("SWEPT " + n + " MESS" + (n > 1 ? "ES" : ""));
  },
  bath: function () {
    if (!awake()) { return; }
    apply(CFG.act.bath); S.poops = [];
    say("ALL CLEAN AND SHINY");
  },
  play: function () {
    if (S.stats.energy < 15) { refuse("NO - TOO TIRED"); return; }
    openPlayMenu();
  },
  light: function () {
    if (S.dead) { return; }
    if (S.form === "egg") { say("AN EGG DOES NOT SLEEP"); return; }
    if (!inSleepWindow()) { say("NOT BEDTIME YET"); return; }
    S.lightOn = !S.lightOn;
    say(S.lightOn ? "LIGHT ON - AWAKE" : "LIGHT OFF - ZZZ");
  },
  med: function () {
    if (S.dead) { return; }
    if (!S.sick) { say("NOT SICK RIGHT NOW"); return; }
    S.sick = false; apply(CFG.act.cure); addFx("pill");
    say("MEDICINE TAKEN");
  }
};

function apply(d) {
  for (var k in d) {
    if (Object.prototype.hasOwnProperty.call(d, k)) {
      S.stats[k] = clamp(S.stats[k] + d[k], 0, 100);
    }
  }
}

/* =========================================================
   MINIGAMES — 좌우 맞히기(P1), 점프, 댄스(커넥션 V1)
   단계가 오를수록 해금되고, 기본 체중에서는 놀 수 없다
   ========================================================= */
var STAGE_RANK = { EGG: 0, BABY: 0, CHILD: 1, TEEN: 2, ADULT: 3 };
var GAMES = [
  { id: "GUESS", label: "GUESS", need: 0 },
  { id: "JUMP",  label: "JUMP",  need: 1 },
  { id: "DANCE", label: "DANCE", need: 2 }
];
function unlockedGames() {
  var rank = STAGE_RANK[stageKey()] || 0, out = [], i;
  for (i = 0; i < GAMES.length; i++) { if (GAMES[i].need <= rank) { out.push(GAMES[i]); } }
  return out;
}

var game = null;
var playMenu = [], playSel = 0;

function openPlayMenu() {
  if (!awake()) { return; }
  if (S.weight <= baseWeight()) { refuse("NO - TOO LIGHT"); return; }
  playMenu = unlockedGames().map(function (g) { return g.label; });
  playMenu.push("BACK");
  playSel = 0;
  MODE = "PLAYMENU";
}

function startGame(id) {
  if (id === "JUMP") {
    game = { kind: "JUMP", round: 1, total: 5, wins: 0, hx: 96, air: 0, judged: false, flash: "", flashT: 0 };
    say("B TO JUMP  A QUIT");
  } else if (id === "DANCE") {
    game = { kind: "DANCE", round: 1, total: 4, wins: 0, seq: [], phase: "SHOW", showT: 0, inI: 0, flash: "", flashT: 0 };
    danceRound();
    say("WATCH THEN COPY");
  } else {
    game = { kind: "GUESS", round: 1, total: 5, wins: 0, lean: 0, lockUntil: 0, flash: "", done: false };
    say("A LEFT OR C RIGHT?");
  }
  MODE = "GAME";
}

function endGame(won, wins, total) {
  apply(won ? CFG.act.playWin : CFG.act.playLose);
  addWeight(CFG.weight.play);
  S.playCount += 1;
  say(won ? wins + "/" + total + " WHAT A GAME!" : wins + "/" + total + " STILL FUN");
  game = null;
  MODE = "NORMAL";
  paintSel();
}

/* ---- 좌우 맞히기 ---- */
function guessPick(dir) {
  if (!game || game.done || Date.now() < game.lockUntil) { return; }
  var petDirPick = Math.random() < 0.5 ? -1 : 1;
  game.lean = petDirPick;
  var hit = petDirPick === dir;
  if (hit) { game.wins += 1; }
  game.flash = hit ? "HIT" : "MISS";
  game.lockUntil = Date.now() + 650;
  if (game.round >= game.total) {
    game.done = true;
    var w = game.wins;
    setTimeout(function () { endGame(w >= 3, w, 5); render(); }, 700);
  } else {
    game.round += 1;
  }
}

/* ---- 점프 ---- */
var JUMP_ARC = [0, -4, -9, -13, -15, -15, -13, -9, -4];
function jumpTick() {
  var g = game;
  if (g.air > 0) { g.air -= 1; }
  if (g.flashT > 0) { g.flashT -= 1; }
  g.hx -= 4;
  if (!g.judged && g.hx <= 34) {
    g.judged = true;
    if (g.air > 0) { g.wins += 1; g.flash = "OVER!"; }
    else { g.flash = "OUCH"; }
    g.flashT = 6;
  }
  if (g.hx < -8) {
    if (g.round >= g.total) {
      var w = g.wins;
      endGame(w >= 3, w, g.total);
      return;
    }
    g.round += 1; g.hx = 96; g.judged = false; g.air = 0;
  }
}
function jumpPress() {
  if (game.air === 0) { game.air = JUMP_ARC.length - 1; }
}

/* ---- 댄스 ---- */
function danceRound() {
  var g = game, n = g.round + 1, i;
  g.seq = [];
  for (i = 0; i < n; i++) { g.seq.push([-1, 0, 1][Math.floor(Math.random() * 3)]); }
  g.phase = "SHOW"; g.showT = 0; g.inI = 0;
}
function danceTick() {
  var g = game;
  if (g.flashT > 0) { g.flashT -= 1; }
  if (g.phase !== "SHOW") { return; }
  g.showT += 1;
  if (Math.floor(g.showT / 6) >= g.seq.length) { g.phase = "INPUT"; }
}
function dancePress(move) {
  var g = game;
  if (g.phase !== "INPUT") { return; }
  if (g.seq[g.inI] !== move) {
    var w = g.wins;
    g.flash = "WRONG"; g.flashT = 5;
    setTimeout(function () { endGame(w >= 3, w, g.total); render(); }, 600);
    g.phase = "OVER";
    return;
  }
  g.inI += 1;
  if (g.inI >= g.seq.length) {
    g.wins += 1;
    g.flash = "NICE!"; g.flashT = 5;
    if (g.round >= g.total) {
      var w2 = g.wins;
      g.phase = "OVER";
      setTimeout(function () { endGame(w2 >= 3, w2, g.total); render(); }, 600);
    } else {
      g.round += 1;
      danceRound();
    }
  }
}

function gameTick() {
  if (!game) { return; }
  if (game.kind === "JUMP") { jumpTick(); }
  else if (game.kind === "DANCE") { danceTick(); }
}

/* =========================================================
   RENDER
   ========================================================= */
var cv = document.getElementById("lcd");
var cx = cv.getContext("2d");
var W = cv.width, H = cv.height;
var FLOOR = H - 8;

function drawSprite(ctx, rows, holes, x, y, sc, bg) {
  sc = sc || 1;
  holes = holes || "";
  for (var r = 0; r < rows.length; r++) {
    for (var c = 0; c < rows[r].length; c++) {
      var ch = rows[r][c];
      if (ch === ".") { continue; }
      var hole = holes.indexOf(ch) !== -1;
      if (hole && !bg) { continue; }
      ctx.fillStyle = hole ? bg : INK;
      ctx.fillRect(x + c * sc, y + r * sc, sc, sc);
    }
  }
}

/* 몬스터 전용 그리기 — 눈을 따로 찍어서 보는 방향을 만든다 */
function drawPet(rows, holes, x, y, sc, bg, eyeDx, closed) {
  drawSprite(cx, rows, holes.replace("E", ""), x, y, sc, bg);
  if (closed) { return; }
  cx.fillStyle = bg;
  for (var r = 0; r < rows.length; r++) {
    for (var c = 0; c < rows[r].length; c++) {
      if (rows[r][c] !== "E") { continue; }
      var tc = c + eyeDx;
      if (rows[r][tc] === undefined || rows[r][tc] === ".") { tc = c; }  // 몸 밖으로는 안 나간다
      cx.fillRect(x + tc * sc, y + r * sc, sc, sc);
    }
  }
}

var MIRROR = {};
function mirrored(key, rows) {
  if (!MIRROR[key]) {
    var out = [], i;
    for (i = 0; i < rows.length; i++) { out.push(rows[i].split("").reverse().join("")); }
    MIRROR[key] = out;
  }
  return MIRROR[key];
}

function drawText(str, x, y, sc) {
  sc = sc || 1;
  str = String(str).toUpperCase();
  cx.fillStyle = INK;
  for (var i = 0; i < str.length; i++) {
    var g = glyph(str[i]);
    for (var r = 0; r < 5; r++) {
      for (var c = 0; c < 3; c++) {
        if (g[r][c] === "#") {
          cx.fillRect(x + i * 4 * sc + c * sc, y + r * sc, sc, sc);
        }
      }
    }
  }
}

var frame = 0;

/* 대기 동작 — 걷기 / 멈춤 / 제자리 뛰기 / 뒤돌기를 섞고,
   눈 깜빡임, 두리번거림, 입 여닫기를 따로 돌린다 */
var petX = 0, petDir = 1, petMode = "WALK", modeLeft = 0, step = 0;
var blinkLeft = 0, blinkWait = 30;
var hopLeft = 0, eyeLook = 0, eyeLookLeft = 0;
var flyT = 0, flyLen = 0, flyH = 0;
var HOP_ARC = [0, -4, -7, -8, -8, -6, -3, 0];

/* 날개나 지느러미가 있는 폼일수록 높이, 자주 뜬다 */
var FLY = {
  dragon:   { h: 16, p: 0.30 },
  starborn: { h: 16, p: 0.30 },
  guardian: { h: 12, p: 0.24 },
  teenAqua: { h: 10, p: 0.20 },
  teenFire: { h: 9,  p: 0.16 }
};
function flyTrait() { return FLY[S.form] || { h: 7, p: 0.10 }; }
function rnd(n) { return Math.floor(Math.random() * n); }

function pickMode() {
  // 비행 확률을 먼저 떼고, 남은 확률을 나머지 동작에 비례 배분한다.
  // 그냥 누적 구간으로 쓰면 비행이 잦은 폼에서 뒤쪽 동작이 밀려나 사라진다.
  var t = flyTrait(), rest = 1 - t.p, r = Math.random();
  var bWalk = t.p + rest * 0.42;
  var bIdle = bWalk + rest * 0.30;
  var bHop  = bIdle + rest * 0.17;
  if (r < t.p) {
    petMode = "FLY";
    flyH = t.h; flyT = 0; flyLen = 26 + rnd(34);
    modeLeft = flyLen;
    if (Math.random() < 0.5) { petDir = -petDir; }
  } else if (r < bWalk) {
    petMode = "WALK"; modeLeft = 16 + rnd(34);
    if (Math.random() < 0.35) { petDir = -petDir; }
  } else if (r < bIdle) {
    petMode = "IDLE"; modeLeft = 12 + rnd(24);
  } else if (r < bHop) {
    petMode = "HOP"; hopLeft = HOP_ARC.length - 1; modeLeft = HOP_ARC.length + 2;
  } else {
    petMode = "TURN"; petDir = -petDir; modeLeft = 6 + rnd(6);
  }
}

/* 떠 있는 높이 — 올라갔다 머물다 내려온다 */
function flyAlt() {
  var up = 8;
  if (flyT < up) { return -Math.round(flyH * flyT / up); }
  if (flyT > flyLen - up) { return -Math.round(flyH * (flyLen - flyT) / up); }
  return -(flyH + (Math.floor(frame / 4) % 2));
}

function animate() {
  modeLeft -= 1;
  if (modeLeft <= 0) { pickMode(); }

  if (petMode === "WALK" && frame % 2 === 0) {
    petX += petDir;
    step += 1;
    if (petX > 13) { petX = 13; petDir = -1; }
    if (petX < -13) { petX = -13; petDir = 1; }
  }
  if (petMode === "FLY") {
    flyT += 1;
    if (frame % 3 === 0) {
      petX += petDir;
      if (petX > 14) { petX = 14; petDir = -1; }
      if (petX < -14) { petX = -14; petDir = 1; }
    }
  }
  if (hopLeft > 0) { hopLeft -= 1; }

  blinkWait -= 1;
  if (blinkWait <= 0) { blinkLeft = 2; blinkWait = 22 + rnd(55); }
  if (blinkLeft > 0) { blinkLeft -= 1; }

  // 멈춰 있을 때는 가끔 주위를 두리번거린다
  if (eyeLookLeft > 0) { eyeLookLeft -= 1; }
  else if (petMode !== "WALK" && Math.random() < 0.06) {
    eyeLook = Math.random() < 0.5 ? -1 : 1;
    eyeLookLeft = 6 + rnd(10);
  }
}

/* 먹기 — 세 입에 나눠 먹는다. 한 입 = 입 벌림 3프레임 + 다묾 3프레임 */
var eat = null;
var EAT_BITE = 6, EAT_BITES = 3;
function startEat(kind) { eat = { kind: kind, t: 0 }; refuseLeft = 0; }
function eatMouthOpen() { return eat && (eat.t % EAT_BITE) < 3; }
/* 몇 입째 먹었는가 — 입을 다무는 순간 한 입이 사라진다 */
function eatStage() { return Math.floor(eat.t / EAT_BITE) + ((eat.t % EAT_BITE) >= 3 ? 1 : 0); }
function eatTick() {
  if (!eat) { return; }
  eat.t += 1;
  if (eat.t >= EAT_BITE * EAT_BITES) {
    if (eat.kind === "snack") { addFx("heart", 900); }   // 간식을 다 먹으면 기뻐한다
    eat = null;
  }
}

/* 거절 — 고개를 좌우로 도리도리 */
var refuseLeft = 0;
var REFUSE_FRAMES = 12;
function refuse(msg) {
  refuseLeft = REFUSE_FRAMES;
  say(msg);
}
/* 지금 고개가 어느 쪽인가: 두 프레임마다 좌우를 바꾼다 */
function refuseSide() { return (Math.floor(refuseLeft / 2) % 2) ? 1 : -1; }

/* 입을 다무는 순간인가 — 걸을 때는 빠르게, 서 있을 때는 느리게 */
function mouthShut() {
  if (S.sleeping) { return true; }
  if (refuseLeft > 0) { return true; }   // 입을 꾹 다물고 고개를 젓는다
  if (eat) { return !eatMouthOpen(); }    // 먹는 중에는 벌렸다 다물었다
  if (petMode === "WALK") { return step % 4 < 2; }
  if (petMode === "FLY") { return false; }
  return frame % 26 < 6;
}

/* 화면 모드 — 조작은 오직 A / B / C */
var MODE = "NORMAL";          // NORMAL | FEED | STATUS | DEX | GAME
var feedSel = 0, dexIdx = 0;
var FEED_MENU = ["MEAL", "SNACK", "BACK"];

/* LCD 상단에 잠깐 떴다 사라지는 메시지 */
var toast = "", toastUntil = 0;
function say(t) { toast = String(t).toUpperCase(); toastUntil = Date.now() + 2600; }
function centerX(s, sc) { return Math.round((W - textWidth(s, sc)) / 2); }

/* =========================================================
   PAGES — 전부 LCD 안에 비트맵으로 그린다
   ========================================================= */
function drawBlocks(x, y, val) {
  var on = Math.round(val / 12.5), i, bx;
  cx.fillStyle = INK;
  for (i = 0; i < 8; i++) {
    bx = x + i * 7;
    if (i < on) {
      cx.fillRect(bx, y, 5, 5);
    } else {
      cx.fillRect(bx, y, 5, 1); cx.fillRect(bx, y + 4, 5, 1);
      cx.fillRect(bx, y, 1, 5); cx.fillRect(bx + 4, y, 1, 5);
    }
  }
}

var ROWS = [
  { k: "hunger", label: "FOOD" }, { k: "hygiene", label: "CLEAN" },
  { k: "energy", label: "REST" }, { k: "affection", label: "LOVE" },
  { k: "health", label: "LIFE" }
];

function drawStatusPage() {
  var f = FORMS[S.form] || FORMS.baby;
  drawText(S.form === "egg" ? "EGG" : S.name + " " + f.name, 3, 2, 1);
  var cd = new Date(S.clock), hm = pad2(cd.getHours()) + ":" + pad2(cd.getMinutes());
  drawText(hm, W - textWidth(hm, 1) - 3, 2, 1);
  drawText("AGE " + fmtAge(S.ageMin) + " WT " + S.weight, 3, 9, 1);
  drawText("MISS " + S.mistakes + " PLAY " + S.playCount, 3, 16, 1);
  cx.fillStyle = INK;
  cx.fillRect(3, 22, W - 6, 1);
  for (var i = 0; i < ROWS.length; i++) {
    drawText(ROWS[i].label, 3, 26 + i * 8, 1);
    drawBlocks(26, 26 + i * 8 - 1, S.stats[ROWS[i].k]);
  }
  var w = sleepWindowNow();
  var state = S.dead ? "GONE" : (S.sick ? "SICK" : (S.sleeping ? "ASLEEP" : "OK"));
  drawText(state + " BED " + w[0] + "  B CLOSE", 3, 66, 1);
}

function drawDexPage(bg) {
  var id = DEX_ORDER[dexIdx], f = FORMS[id], seen = !!dex.seen[id];
  var got = 0;
  for (var i = 0; i < DEX_ORDER.length; i++) { if (dex.seen[DEX_ORDER[i]]) { got += 1; } }

  drawText("DEX " + got + "/" + DEX_ORDER.length, 3, 2, 1);
  var idx = (dexIdx + 1) + "/" + DEX_ORDER.length;
  drawText(idx, W - textWidth(idx, 1) - 3, 2, 1);
  cx.fillStyle = INK;
  cx.fillRect(3, 9, W - 6, 1);

  if (seen) {
    drawSprite(cx, SPR[f.spr], HOLES[f.spr], 32, 13, 2, bg);
  } else {
    cx.globalAlpha = 0.25;
    drawSprite(cx, SPR[f.spr], "", 32, 13, 2, bg);
    cx.globalAlpha = 1;
  }
  var nm = seen ? f.name : "? ? ?";
  drawText(nm, centerX(nm, 1), 48, 1);
  var sub = seen ? "SEEN x" + dex.seen[id] : "NOT FOUND YET";
  drawText(sub, centerX(sub, 1), 56, 1);
  drawText("A C PAGE  B CLOSE", centerX("A C PAGE  B CLOSE", 1), 66, 1);
}

function drawPlayMenu() {
  drawText("PLAY", centerX("PLAY", 1), 3, 1);
  cx.fillStyle = INK;
  cx.fillRect(3, 10, W - 6, 1);
  var top = 18, gap = playMenu.length > 3 ? 11 : 12;
  for (var i = 0; i < playMenu.length; i++) {
    var y = top + i * gap;
    if (i === playSel) { drawText(">", 22, y, 1); }
    drawText(playMenu[i], 32, y, 1);
  }
  drawText("A C MOVE  B OK", centerX("A C MOVE  B OK", 1), 66, 1);
}

function drawFeedPage() {
  drawText("FEED", centerX("FEED", 1), 3, 1);
  cx.fillStyle = INK;
  cx.fillRect(3, 10, W - 6, 1);
  for (var i = 0; i < FEED_MENU.length; i++) {
    var y = 22 + i * 12;
    if (i === feedSel) { drawText(">", 24, y, 1); }
    drawText(FEED_MENU[i], 34, y, 1);
  }
  drawText("A C MOVE  B OK", centerX("A C MOVE  B OK", 1), 66, 1);
}

/* =========================================================
   MAIN RENDER
   ========================================================= */
function render() {
  frame += 1;
  var calling = !!S.call && !S.dead && MODE === "NORMAL";
  cv.className = (calling && frame % 8 < 4) ? "blink" : "";
  var bg = (S.sleeping && MODE === "NORMAL") ? LCD_DIM : LCD;
  cx.fillStyle = bg;
  cx.fillRect(0, 0, W, H);

  if (MODE === "STATUS") { drawStatusPage(); paintAlerts(); return; }
  if (MODE === "DEX") { drawDexPage(bg); paintAlerts(); return; }
  if (MODE === "FEED") { drawFeedPage(); paintAlerts(); return; }
  if (MODE === "PLAYMENU") { drawPlayMenu(); paintAlerts(); return; }

  cx.fillStyle = INK;
  for (var i = 0; i < W; i += 3) { cx.fillRect(i, FLOOR, 1, 1); }

  if (S.dead) {
    drawSprite(cx, SPR.grave, HOLES.grave, 24, FLOOR - 45, 3, bg);
    drawText("R I P", centerX("R I P", 2), 6, 2);
    paintAlerts();
    return;
  }

  var moving = !S.sleeping && S.form !== "egg" && !game;

  var bob;
  if (S.sleeping) {
    bob = (frame % 22 < 11) ? 0 : 1;          // 자는 동안의 숨결
  } else if (game) {
    bob = frame % 2;
  } else if (game && game.kind === "DANCE" && game.phase === "SHOW" &&
             gameLeanIsJump()) {
    bob = -8;                                  // 댄스의 점프 동작
  } else if (refuseLeft > 0 || eat) {
    bob = 0;                                   // 제자리에 서서 고개를 젓거나 먹는다
  } else if (petMode === "FLY") {
    bob = flyAlt();                            // 떠 있는 중
  } else if (petMode === "HOP" && hopLeft > 0) {
    bob = HOP_ARC[HOP_ARC.length - 1 - hopLeft];   // 제자리 뛰기
  } else if (petMode === "WALK") {
    bob = step % 2;                            // 걸음마다 오르내린다
  } else {
    bob = (frame % 18 < 9) ? 0 : 1;            // 서 있을 때의 숨결
  }

  var px = 24 + (game ? gameLean() * 12 : petX);
  if (!game && S.call && !S.sleeping && frame % 4 < 2) { px += 1; }  // 부를 때는 몸을 들썩인다
  var shaking = refuseLeft > 0 && !S.sleeping && !game;
  if (shaking) { px += refuseSide(); }
  if (eat && !game) { px = 16; }
  var py = FLOOR - 45 + bob;
  if (game && game.kind === "JUMP") {
    px = 6;
    py = FLOOR - 45 + JUMP_ARC[JUMP_ARC.length - 1 - game.air];
  }

  if (game) {
    drawText(game.round + "/" + game.total, 3, 3, 1);
    var wtxt = "WIN " + game.wins;
    drawText(wtxt, W - textWidth(wtxt, 1) - 3, 3, 1);
    if (game.kind === "GUESS") {
      // 좌우 맞히기는 몸이 올라가지 않으니 큰 글씨를 써도 겹치지 않는다
      if (game.flash && Date.now() < game.lockUntil) {
        drawText(game.flash, centerX(game.flash, 2), 11, 2);
      }
    } else {
      // 점프·댄스는 몸이 위로 뜨거나 화면을 넓게 쓰므로 헤더 줄에 적는다
      var head = "";
      if (game.flash && game.flashT > 0) { head = game.flash; }
      else if (game.kind === "DANCE" && game.phase !== "OVER") {
        head = game.phase === "SHOW" ? "WATCH" : "COPY";
      }
      if (head) { drawText(head, centerX(head, 1), 3, 1); }
    }
  } else if (Date.now() < toastUntil && toast) {
    drawText(toast, centerX(toast, 1), 3, 1);
  } else if (S.form === "egg") {
    drawText("EGG", centerX("EGG", 1), 3, 1);
  }

  var form = FORMS[S.form] || FORMS.baby;
  var rows = SPR[form.spr];
  var holes = HOLES[form.spr];
  var faceLeft = eat ? false : (shaking ? (refuseSide() < 0) : (petDir < 0));
  if (!S.sleeping && faceLeft && !game) { rows = mirrored(form.spr, rows); }
  if (S.form === "egg") {
    var near = S.ageMin >= CFG.stages.hatch - 1;          // 부화 직전
    var big = (frame % (near ? 6 : 10)) < (near ? 3 : 5); // 커졌다 작아졌다
    var wob = near ? (frame % 2) : ((frame % 14 < 7) ? 0 : 1);
    drawSprite(cx, big ? SPR.egg : SPR.eggSmall, HOLES.egg, 24 + wob, py, 3, bg);
  } else if (S.sleeping && form.sleepSpr) {
    drawSprite(cx, SPR[form.sleepSpr], HOLES[form.sleepSpr], 24, py + 3, 3, bg);
  } else {
    var eyeDx = 0;
    if (game) { eyeDx = gameLean(); }
    else if (!S.sleeping) {
      if (eat) { eyeDx = 1; }
      else if (shaking) { eyeDx = refuseSide(); }
      else { eyeDx = (petMode === "WALK" || petMode === "FLY") ? petDir : (eyeLookLeft > 0 ? eyeLook : 0); }
    }
    if (!game && mouthShut()) { holes = holes.replace("M", ""); }   // 입을 다문다
    drawPet(rows, holes, px, py, 3, bg, eyeDx, blinkLeft > 0 || S.sleeping);
  }

  if (eat && !game) {
    var st = eatStage();
    if (st < EAT_BITES) {
      var fk = eat.kind + st;
      drawSprite(cx, SPR[fk], HOLES[fk], 66, py + 20, 2, bg);
    }
  }

  if (game && game.kind === "JUMP") {
    cx.fillStyle = INK;
    cx.fillRect(game.hx, FLOOR - 11, 4, 11);
    cx.fillRect(game.hx - 2, FLOOR - 11, 8, 2);
  }

  if (S.sleeping) { drawZ(px + 50, py + 4); }
  if (S.sick) { drawCross(px + 50, py + 16); }

  for (var p = 0; p < S.poops.length; p++) {
    drawSprite(cx, SPR.poop, "", S.poops[p].x, FLOOR - 16, 2, bg);
  }

  var now = Date.now();
  fx = fx.filter(function (e) { return e.until > now; });
  if (fx.length) {
    drawSprite(cx, SPR[fx[0].spr], HOLES[fx[0].spr], px + 18, py - 14 - (Math.floor(frame / 3) % 3), 2, bg);
  }

  paintAlerts();
}

/* 게임 중 몬스터가 어느 쪽으로 기우는가 */
function gameLeanIsJump() {
  if (!game || game.kind !== "DANCE" || game.phase !== "SHOW") { return false; }
  var i = Math.floor(game.showT / 6);
  return i < game.seq.length && game.showT % 6 < 4 && game.seq[i] === 0;
}

function gameLean() {
  if (!game) { return 0; }
  if (game.kind === "GUESS") { return game.lean; }
  if (game.kind === "DANCE" && game.phase === "SHOW") {
    var i = Math.floor(game.showT / 6);
    if (i < game.seq.length && game.showT % 6 < 4) { return game.seq[i]; }
  }
  return 0;
}

function fmtAge(min) {
  var d = Math.floor(min / 1440), h = Math.floor((min % 1440) / 60), m = min % 60;
  if (d > 0) { return d + "D " + h + "H"; }
  if (h > 0) { return h + "H" + m + "M"; }
  return m + "M";
}

/* =========================================================
   ICON STRIP — 표시 전용. 조작은 A / B / C 로만 한다
   ========================================================= */
var ICONS = [
  { act: "feed", label: "FEED" }, { act: "play", label: "PLAY" },
  { act: "sweep", label: "SWEEP" }, { act: "bath", label: "BATH" },
  { act: "light", label: "LIGHT" }, { act: "med", label: "MED" },
  { act: "status", label: "STATUS" }, { act: "dex", label: "DEX" }
];
var sel = 0;

function buildIcons() {
  var top = document.getElementById("stripTop");
  var bot = document.getElementById("stripBottom");
  ICONS.forEach(function (ic, i) {
    var d = document.createElement("div");
    d.className = "ic";
    d.dataset.act = ic.act;
    d.dataset.idx = String(i);
    d.setAttribute("aria-hidden", "true");

    var c = document.createElement("canvas");
    c.width = 24; c.height = 24;
    c.style.width = "24px"; c.style.height = "24px";
    var g = c.getContext("2d");
    drawSprite(g, ICON_ART[ic.act], "", 0, 0, 2, null);
    var im = g.getImageData(0, 0, 24, 24);
    for (var q = 0; q < im.data.length; q += 4) {
      if (im.data[q + 3] > 0) { im.data[q] = 230; im.data[q + 1] = 230; im.data[q + 2] = 234; }
    }
    g.putImageData(im, 0, 0);

    var s = document.createElement("span");
    s.textContent = ic.label;
    d.appendChild(c); d.appendChild(s);
    (i < 4 ? top : bot).appendChild(d);
  });
}

function paintSel() {
  var all = document.querySelectorAll(".ic");
  for (var i = 0; i < all.length; i++) {
    all[i].dataset.sel = (MODE === "NORMAL" && Number(all[i].dataset.idx) === sel) ? "1" : "0";
  }
}

var CALL_ICON = { HUNGRY: "feed", LONELY: "play", MESS: "sweep", SLEEP: "light", SICK: "med" };
function paintAlerts() {
  var want = (S.call && !S.dead) ? CALL_ICON[S.call.type] : null;
  var acts = ["feed", "play", "sweep", "light", "med"];
  for (var i = 0; i < acts.length; i++) { setAlert(acts[i], acts[i] === want); }
}
function setAlert(act, on) {
  var b = document.querySelector('.ic[data-act="' + act + '"]');
  if (b) { b.dataset.alert = on ? "1" : "0"; }
}

/* =========================================================
   EVENTS
   ========================================================= */
var CALL_TEXT = {
  HUNGRY: "HUNGRY!", LONELY: "PLAY WITH ME!", MESS: "CLEAN ME UP!",
  SLEEP: "SLEEPY - LIGHT OFF", SICK: "SICK - GIVE MED"
};
function flushEvents() {
  while (pendingEvents.length) {
    var e = pendingEvents.shift();
    if (e.t === "hatch") { say("THE EGG CRACKED!"); }
    else if (e.t === "evolve") { say("NOW " + FORMS[e.form].name + "!"); addFx("heart", 2200); }
    else if (e.t === "sick") { say("SICK - GIVE MED"); }
    else if (e.t === "wake") { say("GOOD MORNING"); }
    else if (e.t === "call") { say(CALL_TEXT[e.type] || "NEEDS YOU"); }
    else if (e.t === "death") { showRestart(); }
  }
}

var modal = document.getElementById("modal");
function showRestart() {
  modalStage = "DEATH";
  document.getElementById("modalTitle").textContent = "GOODBYE";
  document.getElementById("setupClockWrap").style.display = "none";
  document.getElementById("nameInput").style.display = "none";
  document.getElementById("modalText").textContent =
    S.name + " LIVED " + fmtAge(S.deathAge) + ". " + S.deathCause +
    ". THE RECORD STAYS IN THE DEX. TAKE A NEW EGG?";
  document.getElementById("nameInput").value = "";
  document.getElementById("goBtn").textContent = "NEW EGG";
  modal.dataset.open = "1";
}

/* =========================================================
   INPUT — A / B / C 세 버튼이 전부
   ========================================================= */
function pressA() {
  if (eat) { eat = null; render(); return; }   // 먹는 장면 건너뛰기
  if (MODE === "GAME") { gameInput("A"); }
  else if (MODE === "PLAYMENU") { playSel = (playSel + playMenu.length - 1) % playMenu.length; }
  else if (MODE === "FEED") { feedSel = (feedSel + FEED_MENU.length - 1) % FEED_MENU.length; }
  else if (MODE === "DEX") { dexIdx = (dexIdx + DEX_ORDER.length - 1) % DEX_ORDER.length; }
  else if (MODE === "NORMAL") { sel = (sel + ICONS.length - 1) % ICONS.length; }
  paintSel(); render();
}
function pressC() {
  if (eat) { eat = null; render(); return; }   // 먹는 장면 건너뛰기
  if (MODE === "GAME") { gameInput("C"); }
  else if (MODE === "PLAYMENU") { playSel = (playSel + 1) % playMenu.length; }
  else if (MODE === "FEED") { feedSel = (feedSel + 1) % FEED_MENU.length; }
  else if (MODE === "DEX") { dexIdx = (dexIdx + 1) % DEX_ORDER.length; }
  else if (MODE === "NORMAL") { sel = (sel + 1) % ICONS.length; }
  paintSel(); render();
}
function pressB() {
  if (eat) { eat = null; render(); return; }   // 먹는 장면 건너뛰기
  if (MODE === "GAME") { gameInput("B"); }
  else if (MODE === "PLAYMENU") {
    var pick = playMenu[playSel];
    if (pick === "BACK") { MODE = "NORMAL"; }
    else { startGame(pick); }
  }
  else if (MODE === "STATUS" || MODE === "DEX") { MODE = "NORMAL"; }
  else if (MODE === "FEED") {
    var pick = FEED_MENU[feedSel];
    MODE = "NORMAL";
    if (pick === "MEAL") { ACTIONS.feed(); }
    else if (pick === "SNACK") { ACTIONS.snack(); }
  } else {
    runIcon(ICONS[sel].act);
  }
  paintSel(); render();
}

/* 게임별 버튼 의미가 다르다 */
function gameInput(key) {
  if (!game) { MODE = "NORMAL"; return; }
  if (game.kind === "GUESS") {
    if (key === "A") { guessPick(-1); }
    else if (key === "C") { guessPick(1); }
    else { game = null; MODE = "NORMAL"; say("STOPPED PLAYING"); }
  } else if (game.kind === "JUMP") {
    if (key === "B") { jumpPress(); }
    else if (key === "A") { game = null; MODE = "NORMAL"; say("STOPPED PLAYING"); }
  } else if (game.kind === "DANCE") {
    dancePress(key === "A" ? -1 : (key === "B" ? 0 : 1));
  }
}

function runIcon(act) {
  if (act === "feed") {
    if (!awake()) { return; }
    feedSel = 0; MODE = "FEED";
  } else if (act === "status") {
    MODE = "STATUS";
  } else if (act === "dex") {
    dexIdx = 0; MODE = "DEX";
  } else {
    ACTIONS[act]();
  }
}

document.getElementById("keyA").addEventListener("click", pressA);
document.getElementById("keyB").addEventListener("click", pressB);
document.getElementById("keyC").addEventListener("click", pressC);

document.addEventListener("keydown", function (ev) {
  if (ev.target && ev.target.tagName === "INPUT") { return; }
  if (!ev.key) { return; }
  if (resetModal.dataset.open === "1") {
    if (ev.key === "Escape") { resetModal.dataset.open = "0"; }
    return;
  }
  if (modal.dataset.open === "1") { return; }
  if (ev.key === "ArrowLeft") { pressA(); }
  else if (ev.key === "ArrowRight") { pressC(); }
  else if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); pressB(); }
});

var nameInput = document.getElementById("nameInput");
nameInput.addEventListener("input", function () {
  nameInput.value = nameInput.value.replace(/[^A-Za-z0-9]/g, "").toUpperCase().slice(0, 6);
});
document.getElementById("goBtn").addEventListener("click", function () {
  if (modalStage === "DEATH") { showSetup(); return; }   // 이별 다음엔 시계 확인부터
  S = newPet(nameInput.value.trim() || "PIP");
  S.born = S.lastSeen = S.clock = Date.now();   // 확인을 누른 이 순간이 0분이다
  saveJSON(KEY_SAVE, S);
  modal.dataset.open = "0";
  MODE = "NORMAL";
  say("AN EGG ARRIVED");
  paintSel(); render();
});

/* =========================================================
   SETUP CLOCK — 원조처럼 시계를 맞추는 대신 기기 시각을 확인시킨다
   ========================================================= */
var DOW = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
function pad2(n) { return (n < 10 ? "0" : "") + n; }
function tickSetupClock() {
  if (modal.dataset.open !== "1") { return; }
  var d = new Date(Date.now());   // 시작 기준과 같은 출처를 쓴다
  document.getElementById("setupClock").innerHTML =
    pad2(d.getHours()) + '<span class="colon" data-off="' + (d.getSeconds() % 2) + '">:</span>' + pad2(d.getMinutes());
  document.getElementById("setupDate").textContent =
    d.getFullYear() + "." + pad2(d.getMonth() + 1) + "." + pad2(d.getDate()) + " " + DOW[d.getDay()];
}
setInterval(tickSetupClock, 500);
var modalStage = "SETUP";   // SETUP: 시계 확인 후 시작 / DEATH: 이별 인사
var SETUP_TEXT = "THIS CLOCK DECIDES DAY AND NIGHT. IF IT IS RIGHT, START. TIME KEEPS RUNNING EVEN WHILE THIS TAB IS CLOSED.";
function showSetup() {
  modalStage = "SETUP";
  document.getElementById("modalTitle").textContent = "AN EGG ARRIVED";
  document.getElementById("modalText").textContent = SETUP_TEXT;
  document.getElementById("setupClockWrap").style.display = "";
  document.getElementById("nameInput").style.display = "";
  document.getElementById("nameInput").value = "";
  document.getElementById("goBtn").textContent = "START";
  modal.dataset.open = "1";
  tickSetupClock();
}

/* =========================================================
   RESET
   ========================================================= */
var resetModal = document.getElementById("resetModal");
function anyModalOpen() {
  return modal.dataset.open === "1" || resetModal.dataset.open === "1";
}
function doReset(clearDex) {
  try {
    localStorage.removeItem(KEY_SAVE);
    if (clearDex) { localStorage.removeItem(KEY_DEX); }
  } catch (e) {}
  if (clearDex) { dex = { seen: {}, records: [] }; }
  game = null; MODE = "NORMAL"; sel = 0;
  S = newPet("PIP");
  resetModal.dataset.open = "0";
  showSetup();
  paintSel(); render();
}
document.getElementById("resetPin").addEventListener("click", function () {
  resetModal.dataset.open = "1";
  document.getElementById("resetCancel").focus();
});
document.getElementById("resetPet").addEventListener("click", function () { doReset(false); });
document.getElementById("resetAll").addEventListener("click", function () { doReset(true); });
document.getElementById("resetCancel").addEventListener("click", function () {
  resetModal.dataset.open = "0";
});

/* =========================================================
   BOOT
   ========================================================= */
function boot() {
  buildIcons();
  paintSel();

  var saved = loadJSON(KEY_SAVE);
  if (saved && saved.v === 3) {
    S = migrate(saved);
    if (typeof S.weight !== "number" || isNaN(S.weight)) { S.weight = baseWeight(); }
    var mins = catchUp();
    flushEvents();
    if (!S.dead && mins > 0) { say(fmtAge(mins) + " PASSED"); }
    if (S.dead) { showRestart(); }
  } else {
    S = newPet("PIP");
    showSetup();
  }
  render();

  setInterval(function () {
    if (!S) { return; }
    var due = Math.floor((Date.now() - S.lastSeen) / CFG.msPerMin);
    if (due > 0) {
      for (var i = 0; i < due && !S.dead; i++) { stepMinute(); }
      S.lastSeen += due * CFG.msPerMin;
      flushEvents();
      saveJSON(KEY_SAVE, S);
    }
  }, 1000);

  setInterval(function () {
    if (!S) { return; }
    if (eat) { eatTick(); }
    else if (refuseLeft > 0) { refuseLeft -= 1; }
    else if (!S.sleeping && S.form !== "egg" && !game && MODE === "NORMAL") { animate(); }
    if (MODE === "GAME") { gameTick(); }
    render();
  }, 120);
  setInterval(function () { if (S) { saveJSON(KEY_SAVE, S); } }, 10000);
  window.addEventListener("beforeunload", function () { if (S) { saveJSON(KEY_SAVE, S); } });

  if (DEV) { say("DEV 1SEC - 1MIN"); }
}

boot();
</script>
